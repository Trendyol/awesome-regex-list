- name: Access Credentials
  description: Patterns for detecting access credentials, API keys, authentication tokens, and secret keys.
  regexes:
    - '\bbasic\s+([a-zA-Z0-9_\-\.=]{20,})\b'
    - '(?<=:\/\/)[a-zA-Z0-9]+:[a-zA-Z0-9]+@[a-zA-Z0-9]+\.[a-zA-Z]+'
    - '\bbearer\s+([a-zA-Z0-9_\-\.=]{20,})\b'
    - '\beyJ[a-zA-Z0-9\-_]+\.[a-zA-Z0-9\-_]+\.[a-zA-Z0-9\-_]{43}\b'
    - "sk-[0-9a-zA-Z]{40,60}"
    - "pypi-[a-zA-Z0-9_-]{32,128}"
    - "sk_live_[0-9a-zA-Z]{24,99}"
    - "sk_test_[0-9a-zA-Z]{24,99}"
    - '(?i)\b(?:api[\s_-]?key|x[\s_-]?api[\s_-]?key|access[\s_-]?token|auth[\s_-]?token|authorization|secret[\s_-]?key|client[\s_-]?secret)\b\s*(?:(?:[:=]\s*([A-Za-z0-9]{12,}))|(?:"([A-Za-z0-9]{12,})"))'
- name: Amazon Web Services Credentials
  description: Patterns for detecting Amazon Web Services credentials and access keys.
  regexes:
    - "AKIA[0-9A-Z]{16}"
    - "ASIA[0-9A-Z]{16}"
    - 'aws_secret_access_key\s*=\s*["'']?[0-9a-zA-Z/+]{40}["'']?'
    - 'amzn\.mws\.[0-9a-f]{8}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{12}'
    - "(?<![A-Za-z0-9_])(?-i:(?:A3T[A-Z0-9]|AKIA|AGPA|AIDA|AROA|AIPA|ANPA|ANVA|ASIA)[A-Z0-9]{16})(?![A-Za-z0-9_])"
- name: Cloudflare Credentials
  description: Patterns for detecting Cloudflare API tokens and credentials.
  regexes:
    - "dev_[a-zA-Z0-9]{40,60}"
    - "exp_[a-zA-Z0-9]{40,60}"
    - "cro_[a-zA-Z0-9]{40,60}"
    - "crw_[a-zA-Z0-9]{40,60}"
- name: Google Credentials
  description: Patterns for detecting Google API keys, OAuth credentials, and service account information.
  regexes:
    - "AIza[0-9A-Za-z-_]{35}"
    - "GOCSPX-[a-zA-Z0-9]{20,35}"
    - "AIzaSy[a-zA-Z0-9-_]{33}"
    - '[0-9]+-[0-9A-Za-z_]{32}\.apps\.googleusercontent\.com'
    - '"type":\s*"service_account"'
    - 'ya29\.[0-9A-Za-z\-_]+'
- name: Address Information
  description: Patterns for detecting physical addresses and location information including street addresses, postal codes, and geographic locations.
  regexes:
    - '(?:\b(?:no|kat|daire|apt|d|k)\b|(?:\d{1,4}(?:/\d{1,3})?)|(?:[A-ZÇĞİÖŞÜ]\s?){1,3})[\s,-]*\b\d{1,4}\b(?:\s\d{1,4})?|(?:\b(?:no)\s?\d{1,3})|(?:\b(?:apt|daire)\s?\d{1,3}(?:[a-z])?)'
- name: Credit Card Information
  description: Patterns for detecting credit card information including card numbers, expiration dates, and CVV codes.
  regexes:
    - '(?:credit|card|kredi|kart|amex|visa|master|discover|american express|diners|unionpay|jcb|troy|kk|cc|cc_no|kartno|banka)[^\d]{0,20}?\b(4\d{3}[\s-]?\d{4}[\s-]?\d{4}[\s-]?\d{1,4}|(?:5[1-5]\d{2}|2(?:2[2-9]\d|[3-6]\d{2}|7[01]\d|720))[\s-]?\d{4}[\s-]?\d{4}[\s-]?\d{4}|3[47]\d{2}[\s-]?\d{6}[\s-]?\d{5}|6(?:011|5\d{2})[\s-]?\d{4}[\s-]?\d{4}[\s-]?\d{4}|3(?:0[0-5]|[68]\d)\d[\s-]?\d{6}[\s-]?\d{4}|62\d{4}[\s-]?\d{4}[\s-]?\d{4}[\s-]?\d{0,3}|35(?:2[8-9]|[3-8]\d)\d[\s-]?\d{4}[\s-]?\d{4}[\s-]?\d{4}|(?:9792|65\d{2}|2205)[\s-]?\d{4}[\s-]?\d{4}[\s-]?\d{4}|36[\s-]?\d{4}[\s-]?\d{4}[\s-]?\d{2})\b'
    - '(cvc|cvv|security[\s_-]?code)[\s:=\-]{0,3}([0-9]{3})(?![0-9])'
- name: Birthday Information
  description: Patterns for detecting birthday information including dates of birth, age, and date of birth.
  regexes:
    - '(?i)\b(doğum[\s_]?tarihi|dogum[\s_]?tarihi|birthday|birth[\s_]?date|date[\s_]?of[\s_]?birth|dob)\b[\s:]*(0[1-9]|[12][0-9]|3[01])[\/\.](0[1-9]|1[0-2])[\/\.]([0-9]{4})\b'
- name: Database Connection Strings
  description: Patterns for detecting database connection strings including database names, server addresses, and credentials.
  regexes:
    - '(?:postgresql://|postgres://|mysql://|mssql://|oracle://|jdbc:|sqlite:///|db2://|firebird://|redis://|mongodb://)[^\s<]+'
- name: Email Addresses
  description: Patterns for detecting email addresses.
  regexes:
    - '[A-Za-z0-9._+-]+@[A-Za-z0-9.-]+\.(?:com|org|net|edu|gov|mil|int|co|io|co\.uk|us|ca|de|au|fr|jp|com\.tr|cn|in|br|ru|it|es|pl|mx|za|nl|se|ch|be|no|fi|dk|kr|gr|pt|hu|at|cz|sk|lt|lv|bg|ro|az|hk|tw|ae|sa|il|tr)'
- name: Fax numbers
  description: Patterns for detecting fax numbers.
  regexes:
    - '(?i)\b(faks|fax)[\s:.-]?\s*(\+?(\d{1,4})?[-\s\.]?(\(?\d{1,4}\)?)?[-\s\.]?\d{1,}[-\s\.]?\d{1,}[-\s\.]?\d{1,}[-\s\.]?\d{1,})\b'
- name: Github Credentials
  description: Patterns for detecting GitHub personal access tokens, fine-grained tokens, OAuth tokens, and GitHub App tokens.
  regexes:
    - '[gG][iI][tT][hH][uU][bB].*[''|"][0-9a-zA-Z]{35,40}[''|"]'
    - 'ghp_[a-zA-Z0-9]{36}'
    - 'github_pat_[a-zA-Z0-9]{22}_[a-zA-Z0-9]{59}'
    - 'gho_[a-zA-Z0-9]{36}'
    - 'ghu_[a-zA-Z0-9]{36}'
    - 'ghs_[a-zA-Z0-9]{36}'
    - 'ghr_[a-zA-Z0-9]{36}'
- name: IBAN Information
  description: Patterns for detecting IBAN numbers.
  regexes:
    - '\b[A-Z]{2}[0-9]{2}[ ]?(?:[0-9A-Z]{4}[ ]?){2,7}[0-9A-Z]{0,4}\b'
- name: IP Addresses
  description: Patterns for detecting IP addresses.
  regexes:
    - '(?<![A-Za-z0-9._/-])(?:(?:10|172\.(?:1[6-9]|2\d|3[01])|192\.168)\.(?:25[0-5]|2[0-4]\d|1\d{2}|[1-9]?\d)\.(?:25[0-5]|2[0-4]\d|1\d{2}|[1-9]?\d)\.(?:25[0-5]|2[0-4]\d|1\d{2}|[1-9]?\d)|(?:25[0-5]|2[0-4]\d|1\d{2}|[1-9]?\d)\.(?:25[0-5]|2[0-4]\d|1\d{2}|[1-9]?\d)\.(?:25[0-5]|2[0-4]\d|1\d{2}|[1-9]?\d)\.(?:25[0-5]|2[0-4]\d|1\d{2}|[1-9]?\d))(?![A-Za-z0-9._/-])'
- name: Mac Addresses
  description: Patterns for detecting Mac addresses.
  regexes:
    - "^([0-9A-Fa-f]{2}[:-]){5}([0-9A-Fa-f]{2})$"
- name: OpenAI Credentials
  description: Patterns for detecting OpenAI credentials.
  regexes:
    - "sk-(?:(?:live|test|proj|svcacct)-)?[a-zA-Z0-9]{32,}"
- name: Password
  description: Patterns for detecting passwords.
  regexes:
    - '["\x27]?(?:password|passcode|parola|şifre|sifre|pwd|passphrase)["\x27]?\s*[:=]\s*["\x27]?(?!var\.)(?!\$\{)(?!os\.getenv)(?!os\.environ)(?!process\.env)(?![A-Za-z0-9._]+_password\b)(?=[^\s"\x27]{8,64})(?=[^\s"\x27]*[A-Za-z])(?=[^\s"\x27]*\d)([^\s"\x27]{8,64})["\x27]?(?:[;.,])?'
- name: Phone Numbers
  description: Patterns for detecting phone numbers in Turkey.
  regexes:
    - '0 \(\d{3}\) \d{3} \d{2} \d{2}'
    - '0\d{3} \d{3} \d{2} \d{2}'
    - '\+90 \d{3} \d{3} \d{4}'
    - '\+90 \d{3} \d{3} \d{2} \d{2}'
    - '\+90-\d{3}-\d{3}-\d{2}-\d{2}'
    - '(?i)\b(telefon|tel|gsm|cep|cell(?:ular)?(?:\s*no)?|phone(?:\s*number)?)\b.{0,30}?(?:\+?90\s*|0)?\s*\(?\d{3}\)?[\s.-]*\d{3}[\s.-]*\d{2}[\s.-]*\d{2}'
    - '^\+90\s*\(\d{3}\)\s*\d{3}\s\d{2}\s\d{2}$'
- name: Private Keys and Certificates
  description: Patterns for detecting private keys and certificates.
  regexes:
    - "(?s)(-----BEGIN (?:PRIVATE|RSA PRIVATE|DSA PRIVATE|EC PRIVATE) KEY-----.*?-----END (?:PRIVATE|RSA PRIVATE|DSA PRIVATE|EC PRIVATE) KEY-----)"
    - "(?s)(-----BEGIN CERTIFICATE-----.*?-----END CERTIFICATE-----)"
- name: Slack Credentials
  description: Patterns for detecting Slack credentials.
  regexes:
    - 'xox[baprs]-\d{4,20}-\d{4,20}-\w{8,24}'
- name: Slack Webhook
  description: Patterns for detecting Slack webhooks.
  regexes:
    - "(http://|https://)*hooks.slack.com/services/T[a-zA-Z0-9_]+/B[a-zA-Z0-9_]+/[a-zA-Z0-9_]+"
- name: Passport Number
  description: Patterns for detecting passport numbers starting with 'U' followed by 8 digits, including Turkish passport formats.
  regexes:
    - '(?i)\b(?:pasaport|passport|p_no|pasaport_no|psprt|belge)\b[^\w]{0,10}?\b(U\d{8})\b'
- name: Turkish Identity Numbers
  description: Patterns for detecting Turkish identity numbers.
  regexes:
    - '\b(?:TC[\s_\.]?Kimlik[\s_\.]?no|T\.C\.[\s_\.]?Kimlik[\s_\.]?no|kimlik[\s_\.]?no|kimlik[\s_\.]?numarası|T\.C\.[\s_\.]?kimlik[\s_\.]?numarası|tc[\s_\.]?kimlik[\s_\.]?no|tc[\s_\.]?kimlik[\s_\.]?numarası|identification[\s_\.]?number|ID[\s_\.]?number|TCKN|tc[\s_\.]?no|National[\s_\.]?Number|National[\s_\.]?Identity[\s_\.]?Number|person[\s_\.]?ID)\b[\s:._-]{0,5}["\x27]*(\d{10}[0,2,4,6,8])["\x27]*'
- name: Turkish ID Serial Number
  description: Patterns for detecting Turkish ID Card serial numbers (e.g., A12Z34567). Format consists of a letter, two digits, another letter, and five digits (9 characters total). Uses Turkish alphabet letters (excludes Q, W, X).
  regexes:
    - '(?i)\b(?:seri\s*no|seri\s*numarası|id\s*serial|kimlik\s*seri|kimlik\s*seri\s*no)\b[^\w]{0,10}?\b([ABCDEFGHIJKLMNOPRSTUVYZ]\d{2}[ABCDEFGHIJKLMNOPRSTUVYZ]\d{5})\b'
- name: Turkish Tax Numbers
  description: Patterns for detecting Turkish tax numbers.
  regexes:
    - '\b(?:Vergi[\s_\.]?no|Vergi[\s_\.]?kimlik[\s_\.]?numarası|Vergi[\s_\.]?kimlik[\s_\.]?no|VKN|Tax[\s_\.]?ID|Tax[\s_\.]?Number|Tax[\s_\.]?Identification[\s_\.]?Number)\b[\s:._-]{0,5}["\x27]*(\d{10})["\x27]*'
